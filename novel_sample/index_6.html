<!DOCTYPE html>
<html lang="zh-TW">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
		<title>書冊閱覽</title>
		<link rel="stylesheet" type="text/css" href="../inner_style.css">
		<link rel="stylesheet" type="text/css" href="../inner_gallery_style.css">
		<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
		<script type="text/javascript" src="../inner_script.js"></script>
		<script type="text/javascript" src="../inner_gallery_script.js"></script>
	</head>
	<body>
		<div class="title">賞圖畫廊</div>

		<!-- pic_gallery -->
		<div id="pic_gallery" class="pic_focus_pos">
			<div class="pic_files_text pic_area">
				<div class="pic_files_text pic_area"
					onclick="clear_pic_gallery(),
					get_pic_dir('magic_square'),
					get_pic_files('magic_square', 'magic_square.png'),
					get_pic_files('magic_square', 'magic_square1.png'),
					get_pic_files('magic_square', 'magic_square2.png'),
					get_pic_files('magic_square', 'magic_square_move.gif')
					">magic_square</div>

				<div class="pic_files_text pic_area"
					onclick="clear_pic_gallery(),
					get_pic_dir('magic_square_2d'),
					get_pic_files('magic_square_2d', 'magic_square.png'),
					get_pic_files('magic_square_2d', 'magic_square1.png'),
					get_pic_dir('magic_square_3d'),
					get_pic_files('magic_square_3d', 'magic_square.png'),
					get_pic_files('magic_square_3d', 'magic_square2.png'),
					get_pic_files('magic_square_3d', 'magic_square_move.gif')
					">magic_square*</div>
			</div>

			<div id="pic_gallery_pic">
				<!-- sample -->
				<!-- <div class="pic_files_text pic_area">images</div> -->
				<!-- <div class="pic_area" onclick="pic_focus_fun('images', 0)"> -->
				<!-- 	<div class="para_pic"> <img src="./images/pose_001_1.png"> </div> -->
				<!-- </div> -->
			</div>

			<div class="empty"></div>
		</div>

		<script type="text/javascript">
			write_pic_focus_fun();
			pic_focus_scale_fun();
		</script>
	</body>
</html>
